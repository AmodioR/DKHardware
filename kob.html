<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hardware | Køb</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="kob-page">
    <header class="site-header">
      <a class="brand-link" href="index.html" aria-label="Hardware forside">
        <img class="brand-logo" src="assets/logo.png" alt="Hardware logo" />
      </a>
      <nav class="main-nav" aria-label="Primær navigation">
        <a href="index.html">Hjem</a>
        <a href="kob.html">Køb</a>
        <a href="saelg.html">Sælg</a>
        <a href="om.html">Om</a>
      </nav>
      <div class="header-actions">
        <button class="btn btn-outline" type="button">Login</button>
        <button class="btn btn-muted" type="button">Kom i gang</button>
      </div>
    </header>

    <main class="marketplace-layout">
      <aside class="filter-card" aria-label="Filtre">
        <h2 class="sr-only">Filtre</h2>

        <div class="filter-group">
          <label for="category">Kategori</label>
          <select id="category" name="category">
            <option value="">Vælg kategori</option>
            <option value="Grafikkort">Grafikkort</option>
            <option value="CPU">CPU</option>
            <option value="RAM">RAM</option>
            <option value="Bundkort">Bundkort</option>
            <option value="Lager">Lager</option>
            <option value="Strømforsyning">Strømforsyning</option>
            <option value="Kabinetter">Kabinetter</option>
            <option value="CPU-kølere">CPU-kølere</option>
            <option value="Kabinetkølere">Kabinetkølere</option>
          </select>
        </div>

        <div class="filter-group" id="brandGroup">
          <label for="brand">Mærke</label>
          <select id="brand" name="brand">
            <option value="">Vælg mærke</option>
          </select>
        </div>

        <div class="filter-group" id="seriesGroup">
          <label for="series">Serie</label>
          <select id="series" name="series">
            <option value="">Vælg serie</option>
          </select>
        </div>

        <div class="filter-group slider-group">
          <label for="priceRange">Pris</label>
          <div class="range-meta">
            <span>0 kr.</span>
            <span id="priceRangeValue">10.000 kr.</span>
          </div>
          <input type="range" id="priceRange" min="0" max="10000" step="100" value="10000" />
        </div>

        <div class="filter-group slider-group">
          <label for="distanceRange">Afstand til sælger</label>
          <div class="range-meta">
            <span>0 km</span>
            <span id="distanceRangeValue">50+ km</span>
          </div>
          <input type="range" id="distanceRange" min="0" max="50" step="1" value="50" />
        </div>

        <div class="deal-legend" aria-label="Deal score forklaring">
          <p><span class="star-badge star-good">★</span> = God deal</p>
          <p><span class="star-badge star-fair">★</span> = Fair deal</p>
          <p><span class="star-badge star-unfair">★</span> = Unfair deal</p>
        </div>

        <button class="btn btn-primary cta-results" type="button">Vis resultater</button>
      </aside>

      <section class="listings-panel" aria-label="Produktoversigt">
        <div class="product-grid" id="listingGrid"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
