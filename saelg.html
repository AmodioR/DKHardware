<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hardware | Sælg</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand-link" href="index.html" aria-label="Hardware forside">
        <img class="brand-logo" src="assets/logo.png" alt="Hardware logo" />
      </a>
      <div class="header-right-group">
        <nav class="main-nav" aria-label="Primær navigation">
          <a href="index.html">Hjem</a>
          <a href="kob.html">Køb</a>
          <a href="saelg.html">Sælg</a>
          <a href="om.html">Om</a>
        </nav>
        <div class="header-actions">
          <button class="btn btn-outline" type="button">Login</button>
          <button class="btn btn-muted" type="button">Kom i gang</button>
        </div>
      </div>
    </header>

    <main class="sell-layout">
      <section class="sell-card" aria-label="Opret opslag">
        <h1>Opret nyt opslag</h1>
        <form id="sellForm" class="sell-form">
          <div class="filter-group">
            <label for="category">Kategori</label>
            <select id="category" name="category" required>
              <option value="">Vælg kategori</option>
              <option value="Grafikkort">Grafikkort</option>
              <option value="CPU">CPU</option>
              <option value="RAM">RAM</option>
              <option value="Bundkort">Bundkort</option>
              <option value="Lager">Lager</option>
              <option value="Strømforsyning">Strømforsyning</option>
              <option value="Kabinetter">Kabinetter</option>
              <option value="CPU-kølere">CPU-kølere</option>
              <option value="Kabinetkølere">Kabinetkølere</option>
            </select>
          </div>

          <div class="filter-group filter-group-disabled" id="brandGroup">
            <label for="brand">Mærke</label>
            <select id="brand" name="brand" disabled required>
              <option value="">Vælg mærke</option>
            </select>
          </div>

          <div class="filter-group filter-group-disabled" id="seriesGroup">
            <label for="series">Serie</label>
            <select id="series" name="series" disabled required>
              <option value="">Vælg serie</option>
            </select>
          </div>

          <div class="filter-group">
            <label for="condition">Stand</label>
            <select id="condition" name="condition" required>
              <option value="Ny">Ny</option>
              <option value="Brugt">Brugt</option>
            </select>
          </div>

          <div class="filter-group">
            <label for="price">Pris</label>
            <input id="price" name="price" type="number" min="0" step="1" placeholder="F.eks. 3500" required />
          </div>

          <div class="filter-group">
            <label for="location">Lokation</label>
            <input id="location" name="location" type="text" placeholder="F.eks. Aarhus" required />
          </div>

          <div class="filter-group">
            <label for="image">Billede</label>
            <input id="image" name="image" type="file" accept="image/*" />
            <img id="imagePreview" class="sell-image-preview" alt="Forhåndsvisning af valgt billede" />
          </div>

          <div class="filter-group">
            <label for="description">Beskrivelse</label>
            <textarea id="description" name="description" rows="5" placeholder="Beskriv varen, tilstand og tilbehør" required></textarea>
          </div>

          <button class="btn btn-primary" type="submit">Opret opslag</button>
          <p class="sell-feedback" id="sellFeedback" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <script src="js/saelg.js"></script>
  </body>
</html>
